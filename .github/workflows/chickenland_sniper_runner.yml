name: "Chicken Land 24/7 Cloud Promo Code Sniper (Dual-Engine)"

on:
  workflow_dispatch:
  schedule:
    # Safety keepalive runs every 2 hours (relay handoff handles normal continuation)
    - cron: "0 */2 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: chickenland-sniper-runner
  cancel-in-progress: true

jobs:
  run_chickenland_sniper:
    name: "24/7 Chicken Land Promo Sniper & Compounding Daemon"
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Launch 24/7 Dual-Engine Sniper & Autonomous Compounder
        env:
          UPSTASH_URL: "${{ secrets.UPSTASH_URL || secrets.UPSTASH_REDIS_REST_URL || 'https://relaxing-starfish-285827.upstash.io' }}"
          UPSTASH_TOKEN: "${{ secrets.UPSTASH_TOKEN || secrets.UPSTASH_REDIS_REST_TOKEN }}"
          TURSO_URL: "${{ secrets.TURSO_URL || secrets.TURSO_DB_URL || 'https://my-agy-fleet-db-aaa2743.aws-ap-south-1.turso.io' }}"
          TURSO_TOKEN: "${{ secrets.TURSO_TOKEN || secrets.TURSO_DB_TOKEN }}"
          REPORT_BOT_TOKEN: "${{ secrets.REPORT_BOT_TOKEN || secrets.ADMIN_BOT_TOKEN || secrets.ALERT_BOT_TOKEN }}"
          ADMIN_BOT_TOKEN: "${{ secrets.REPORT_BOT_TOKEN || secrets.ADMIN_BOT_TOKEN || secrets.ALERT_BOT_TOKEN }}"
          ALERT_BOT_TOKEN: "${{ secrets.ALERT_BOT_TOKEN || secrets.REPORT_BOT_TOKEN || secrets.ADMIN_BOT_TOKEN }}"
          ADMIN_NOTIFICATION_CHANNEL_ID: "-1004358687850"
          OWNER_ID: "${{ secrets.OWNER_ID || '6727787768' }}"
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          # Runs dual MTProto push listener (0ms) + 2.5s HTTP poller + auto-compounding for 5.5h (19800s)
          # then cleanly triggers the next relay run and exits.
          python3 chickenland_promo_sniper.py --watch --interval 2.5 --max-runtime 19800

      - name: Verify Zero-Secret Hygiene
        if: always()
        run: |
          python scripts/maintenance/scan_secrets.py
