name: "Autonomous Fleet Side-Task & Mining Sweeper"

on:
  workflow_dispatch:
  schedule:
    # Run every 2 hours continuously in the cloud
    - cron: "0 */2 * * *"

jobs:
  sweep_fleet_sidetasks:
    name: "Autonomous 12-Bot Fleet Sweeper & Withdrawal Sentinel"
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Verify & Auto-Heal Token Freshness (Pre-Flight)
        env:
          UPSTASH_URL: "${{ secrets.UPSTASH_URL || 'https://relaxing-starfish-285827.upstash.io' }}"
          UPSTASH_TOKEN: "${{ secrets.UPSTASH_TOKEN }}"
          REPORT_BOT_TOKEN: "${{ secrets.ADMIN_BOT_TOKEN }}"
          ADMIN_NOTIFICATION_CHANNEL_ID: "-1004358687850"
          SECRET_KEY: "${{ secrets.SECRET_KEY }}"
        run: |
          python scripts/maintenance/token_expiration_watchdog.py

      - name: 2. Execute 12-Bot Fleet Side-Task & Mining Sweep
        env:
          UPSTASH_URL: "${{ secrets.UPSTASH_URL || 'https://relaxing-starfish-285827.upstash.io' }}"
          UPSTASH_TOKEN: "${{ secrets.UPSTASH_TOKEN }}"
          ALERT_BOT_TOKEN: "${{ secrets.ADMIN_BOT_TOKEN }}"
          OWNER_ID: "${{ secrets.OWNER_ID || '6727787768' }}"
        run: |
          python finish_all_fleet_sidetasks.py

      - name: 3. Universal Fleet Auto-Withdrawal Sweep & Readiness Audit (Post-Flight)
        env:
          UPSTASH_URL: "${{ secrets.UPSTASH_URL || 'https://relaxing-starfish-285827.upstash.io' }}"
          UPSTASH_TOKEN: "${{ secrets.UPSTASH_TOKEN }}"
          REPORT_BOT_TOKEN: "${{ secrets.ADMIN_BOT_TOKEN }}"
          ADMIN_NOTIFICATION_CHANNEL_ID: "-1004358687850"
          PAYOUT_CHANNEL_ID: "-1004402765950"
        run: |
          python scripts/maintenance/fleet_auto_withdrawal_engine.py --sweep
          python scripts/maintenance/audit_withdrawal_readiness.py

      - name: 4. Verify Zero-Secret Hygiene
        run: |
          python scripts/maintenance/scan_secrets.py
