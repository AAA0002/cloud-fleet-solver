name: "Proactive 4-Hour Cloud Token Refresher"

on:
  workflow_dispatch:
  schedule:
    # Run every 4 hours so tokens never age past 4 hours
    - cron: "0 */4 * * *"

jobs:
  dispatch_cloud_token_refresh:
    name: "Execute Autonomous MTProto Token Refresh on GitHub Actions Public Runner"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Autonomous Cloud Token Refresher (Zero Phone Load)
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          TELEGRAM_API_ID: "${{ secrets.TELEGRAM_API_ID || '37321306' }}"
          TELEGRAM_API_HASH: "${{ secrets.TELEGRAM_API_HASH || '5cd9e5bbfb572a4429a0c54774153b47' }}"
          UPSTASH_REDIS_REST_URL: "${{ secrets.UPSTASH_REDIS_REST_URL || secrets.UPSTASH_URL || 'https://relaxing-starfish-285827.upstash.io' }}"
          UPSTASH_REDIS_REST_TOKEN: "${{ secrets.UPSTASH_REDIS_REST_TOKEN || secrets.UPSTASH_TOKEN }}"
          UPSTASH_URL: "${{ secrets.UPSTASH_REDIS_REST_URL || secrets.UPSTASH_URL || 'https://relaxing-starfish-285827.upstash.io' }}"
          UPSTASH_TOKEN: "${{ secrets.UPSTASH_REDIS_REST_TOKEN || secrets.UPSTASH_TOKEN }}"
          TURSO_URL: "${{ secrets.TURSO_URL || secrets.TURSO_DB_URL || 'https://my-agy-fleet-db-aaa2743.aws-ap-south-1.turso.io' }}"
          TURSO_TOKEN: "${{ secrets.TURSO_TOKEN || secrets.TURSO_DB_TOKEN }}"
          TURSO_DB_URL: "${{ secrets.TURSO_URL || secrets.TURSO_DB_URL || 'https://my-agy-fleet-db-aaa2743.aws-ap-south-1.turso.io' }}"
          TURSO_DB_TOKEN: "${{ secrets.TURSO_TOKEN || secrets.TURSO_DB_TOKEN }}"
          SUPABASE_URL: "${{ secrets.SUPABASE_URL || 'https://znbbaozpevurvbfkxakz.supabase.co' }}"
          SUPABASE_SERVICE_KEY: "${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_ANON_KEY }}"
          SUPABASE_ANON_KEY: "${{ secrets.SUPABASE_ANON_KEY }}"
          REPORT_BOT_TOKEN: "${{ secrets.REPORT_BOT_TOKEN || secrets.ADMIN_BOT_TOKEN || secrets.ALERT_BOT_TOKEN }}"
          ADMIN_BOT_TOKEN: "${{ secrets.REPORT_BOT_TOKEN || secrets.ADMIN_BOT_TOKEN || secrets.ALERT_BOT_TOKEN }}"
          ADMIN_NOTIFICATION_CHANNEL_ID: "-1004358687850"
          CF_SECRET_KEY: "${{ secrets.CF_SECRET_KEY || secrets.SECRET_KEY }}"
          SECRET_KEY: "${{ secrets.SECRET_KEY }}"
        run: |
          python3 refresh_cloud_tokens.py

      - name: Verify Token Freshness across 23 Accounts
        env:
          UPSTASH_REDIS_REST_URL: "${{ secrets.UPSTASH_REDIS_REST_URL || secrets.UPSTASH_URL || 'https://relaxing-starfish-285827.upstash.io' }}"
          UPSTASH_REDIS_REST_TOKEN: "${{ secrets.UPSTASH_REDIS_REST_TOKEN || secrets.UPSTASH_TOKEN }}"
          UPSTASH_URL: "${{ secrets.UPSTASH_REDIS_REST_URL || secrets.UPSTASH_URL || 'https://relaxing-starfish-285827.upstash.io' }}"
          UPSTASH_TOKEN: "${{ secrets.UPSTASH_REDIS_REST_TOKEN || secrets.UPSTASH_TOKEN }}"
          REPORT_BOT_TOKEN: "${{ secrets.REPORT_BOT_TOKEN || secrets.ADMIN_BOT_TOKEN || secrets.ALERT_BOT_TOKEN }}"
          ADMIN_BOT_TOKEN: "${{ secrets.REPORT_BOT_TOKEN || secrets.ADMIN_BOT_TOKEN || secrets.ALERT_BOT_TOKEN }}"
          ADMIN_NOTIFICATION_CHANNEL_ID: "-1004358687850"
        run: |
          python3 scripts/maintenance/token_expiration_watchdog.py --check-only

      - name: Verify Zero-Secret Hygiene
        run: |
          python3 scripts/maintenance/scan_secrets.py
