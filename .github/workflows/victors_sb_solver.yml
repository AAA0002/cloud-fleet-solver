name: "Victor's Company — 100% Cloud Turnstile Solver & Referral Pipeline"

on:
  workflow_dispatch:
    inputs:
      target_account:
        description: "Target UID or 'all' for full fleet"
        required: false
        default: "all"
  schedule:
    - cron: "0 */4 * * *"

jobs:
  solve_and_qualify_victors:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies (Xvfb & Google Chrome)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm-dev wget gnupg
          if ! command -v google-chrome &> /dev/null; then
            wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/google-chrome.gpg
            sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          fi

      - name: Install Python Dependencies & SeleniumBase
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install seleniumbase
          sbase install chromedriver

      - name: Run Dedicated Victor's Turnstile Solver & Referral Qualification
        env:
          UPSTASH_REDIS_REST_URL: "${{ secrets.UPSTASH_REDIS_REST_URL || secrets.UPSTASH_URL || 'https://relaxing-starfish-285827.upstash.io' }}"
          UPSTASH_REDIS_REST_TOKEN: "${{ secrets.UPSTASH_REDIS_REST_TOKEN || secrets.UPSTASH_TOKEN }}"
          UPSTASH_URL: "${{ secrets.UPSTASH_REDIS_REST_URL || secrets.UPSTASH_URL || 'https://relaxing-starfish-285827.upstash.io' }}"
          UPSTASH_TOKEN: "${{ secrets.UPSTASH_REDIS_REST_TOKEN || secrets.UPSTASH_TOKEN }}"
          ALERT_BOT_TOKEN: "${{ secrets.ALERT_BOT_TOKEN || secrets.REPORT_BOT_TOKEN || secrets.ADMIN_BOT_TOKEN }}"
          REPORT_BOT_TOKEN: "${{ secrets.REPORT_BOT_TOKEN || secrets.ADMIN_BOT_TOKEN || secrets.ALERT_BOT_TOKEN }}"
          ADMIN_BOT_TOKEN: "${{ secrets.REPORT_BOT_TOKEN || secrets.ADMIN_BOT_TOKEN || secrets.ALERT_BOT_TOKEN }}"
          OWNER_ID: "${{ secrets.OWNER_ID || '6727787768' }}"
          TELEGRAM_API_ID: "${{ secrets.TELEGRAM_API_ID || '37321306' }}"
          TELEGRAM_API_HASH: "${{ secrets.TELEGRAM_API_HASH || '5cd9e5bbfb572a4429a0c54774153b47' }}"
          SUPABASE_URL: "${{ secrets.SUPABASE_URL || 'https://znbbaozpevurvbfkxakz.supabase.co' }}"
          SUPABASE_SERVICE_KEY: "${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_ANON_KEY }}"
          SUPABASE_ANON_KEY: "${{ secrets.SUPABASE_ANON_KEY }}"
          PROXY: "${{ secrets.PROXY || '' }}"
        run: |
          python victors_sb_solver.py
